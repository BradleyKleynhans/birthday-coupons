<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>25 Birthday Coupons</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Rose silhouette, defined once, reused below -->
  <svg width="0" height="0" style="position:absolute">
    <defs>
      <symbol id="rose-symbol" viewBox="0 0 120 260">
  <path d="M60 260 C 58 200 62 170 60 130" stroke="#2E3B2C" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M60 214 l -8 -6 M60 188 l 9 -5" stroke="#2E3B2C" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M60 222 C 40 216 26 228 20 246 C 38 250 54 238 60 222 Z" fill="#3A4A37"/>
  <path d="M60 193 C 82 186 96 198 102 216 C 84 222 66 208 60 193 Z" fill="#3A4A37"/>
  <g transform="translate(60,95)">
        <ellipse rx="30" ry="20" fill="#B23A63" transform="rotate(0)"/>
        <ellipse rx="30" ry="20" fill="#B23A63" transform="rotate(51)"/>
        <ellipse rx="30" ry="20" fill="#B23A63" transform="rotate(102)"/>
        <ellipse rx="30" ry="20" fill="#B23A63" transform="rotate(153)"/>
        <ellipse rx="30" ry="20" fill="#B23A63" transform="rotate(204)"/>
        <ellipse rx="30" ry="20" fill="#B23A63" transform="rotate(255)"/>
        <ellipse rx="30" ry="20" fill="#B23A63" transform="rotate(306)"/>
        <ellipse rx="18" ry="13" fill="#E197B5" transform="rotate(25)"/>
        <ellipse rx="18" ry="13" fill="#E197B5" transform="rotate(85)"/>
        <ellipse rx="18" ry="13" fill="#E197B5" transform="rotate(145)"/>
        <ellipse rx="18" ry="13" fill="#E197B5" transform="rotate(205)"/>
        <ellipse rx="18" ry="13" fill="#E197B5" transform="rotate(265)"/>
        <ellipse rx="18" ry="13" fill="#E197B5" transform="rotate(325)"/>
        <circle r="9" fill="#F6D9E4"/>
      </g>
     </symbol>
    </defs>
  </svg>

<!-- Grass strip across the bottom -->
<svg class="grass-strip" preserveAspectRatio="none" viewBox="0 0 1000 60" aria-hidden="true">
  <defs>
    <pattern id="grass-pattern" width="26" height="60" patternUnits="userSpaceOnUse">
      <path d="M0,60 L4,18 L8,60 Z" fill="#324A38"/>
      <path d="M9,60 L13,8 L17,60 Z" fill="#3D5C43"/>
      <path d="M18,60 L22,24 L26,60 Z" fill="#324A38"/>
    </pattern>
  </defs>
  <rect width="1000" height="60" fill="url(#grass-pattern)"/>
</svg>

<!-- Drifting light particles -->
<div class="lights" aria-hidden="true">
  <div class="light-dot" style="left:4%;  animation-duration:11s; animation-delay:0s;"></div>
  <div class="light-dot" style="left:12%; animation-duration:14s; animation-delay:1.5s;"></div>
  <div class="light-dot" style="left:21%; animation-duration:9s;  animation-delay:.5s;"></div>
  <div class="light-dot" style="left:30%; animation-duration:13s; animation-delay:2.5s;"></div>
  <div class="light-dot" style="left:39%; animation-duration:10s; animation-delay:1s;"></div>
  <div class="light-dot" style="left:48%; animation-duration:15s; animation-delay:3s;"></div>
  <div class="light-dot" style="left:57%; animation-duration:11.5s; animation-delay:.2s;"></div>
  <div class="light-dot" style="left:65%; animation-duration:12s; animation-delay:2s;"></div>
  <div class="light-dot" style="left:73%; animation-duration:9.5s; animation-delay:1.2s;"></div>
  <div class="light-dot" style="left:81%; animation-duration:14.5s; animation-delay:.8s;"></div>
  <div class="light-dot" style="left:89%; animation-duration:10.5s; animation-delay:2.8s;"></div>
  <div class="light-dot" style="left:95%; animation-duration:13.5s; animation-delay:1.8s;"></div>
</div>

  <!-- Background roses -->
<div class="roses-bg" aria-hidden="true">
  <div class="rose-wrap" style="left:0%; width:150px; animation-delay:.1s;">
    <div class="rose-sway" style="animation-duration:6.5s;"><svg class="rose-instance" viewBox="0 0 120 260"><use href="#rose-symbol"/></svg></div>
  </div>
  <div class="rose-wrap" style="left:14%; width:210px; animation-delay:.6s;">
    <div class="rose-sway" style="animation-duration:7.5s; animation-delay:.3s;"><svg class="rose-instance" viewBox="0 0 120 260"><use href="#rose-symbol"/></svg></div>
  </div>
  <div class="rose-wrap" style="left:33%; width:130px; animation-delay:0s;">
    <div class="rose-sway" style="animation-duration:5.5s;"><svg class="rose-instance" viewBox="0 0 120 260"><use href="#rose-symbol"/></svg></div>
  </div>
  <div class="rose-wrap" style="left:60%; width:190px; animation-delay:.9s;">
    <div class="rose-sway" style="animation-duration:7s; animation-delay:.5s;"><svg class="rose-instance" viewBox="0 0 120 260"><use href="#rose-symbol"/></svg></div>
  </div>
  <div class="rose-wrap" style="left:80%; width:145px; animation-delay:.4s;">
    <div class="rose-sway" style="animation-duration:6s;"><svg class="rose-instance" viewBox="0 0 120 260"><use href="#rose-symbol"/></svg></div>
  </div>
  <div class="rose-wrap" style="left:92%; width:200px; animation-delay:.8s;">
    <div class="rose-sway" style="animation-duration:8s; animation-delay:.2s;"><svg class="rose-instance" viewBox="0 0 120 260"><use href="#rose-symbol"/></svg></div>
  </div>
</div>

  <div class="counter" id="counter">1 / 28</div>

  <div class="stage">
    <div class="page-frame" id="frame">
      <div class="page-inner" id="inner"></div>
    </div>
  </div>

  <div class="nav-row">
    <button class="nav-btn" id="prev-btn" type="button">‹ Prev</button>
    <div class="dots" id="dots"></div>
    <button class="nav-btn" id="next-btn" type="button">Next ›</button>
  </div>

  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="coupons-data.js"></script>
  <script src="script.js"></script>

  
</body>
</html>
